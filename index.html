<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thailand Rental Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <style>
    :root {
      --green: #22c55e;
      --green-dark: #16a34a;
      --border: #e5e7eb;
      --muted: #6b7280;
      --text: #111827;
      --bg: #f8fafc;
      --card: #ffffff;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.04);
      --radius: 12px;
      --topbar-h: auto;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    body { display: flex; flex-direction: column; overflow: hidden; }

    /* —— Top bar —— */
    .topbar {
      flex: 0 0 auto;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px 12px;
      z-index: 20;
    }
    .topbar-row1 {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .topbar h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .loc-label {
      color: var(--muted);
      font-size: 13px;
    }
    .loc-label::before {
      content: "📍 ";
      font-size: 12px;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .filters input[type="search"],
    .filters input[type="number"],
    .filters select {
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 10px;
      font: inherit;
      font-size: 13px;
      background: #fff;
      color: var(--text);
      outline: none;
    }
    .filters input[type="search"]:focus,
    .filters input[type="number"]:focus,
    .filters select:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(34,197,94,.15);
    }
    .filters input[type="search"] { min-width: 180px; flex: 1 1 180px; }
    .filters input[type="number"] { width: 100px; }
    .price-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .price-group span { color: var(--muted); font-size: 12px; }
    .btn {
      height: 36px;
      padding: 0 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text);
    }
    .btn:hover { background: #f3f4f6; }
    .btn-reset { color: var(--muted); }
    .result-count {
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      margin-left: auto;
    }
    .result-count strong { color: var(--text); }

    /* —— Layout —— */
    .main {
      flex: 1 1 auto;
      display: flex;
      min-height: 0;
      position: relative;
    }
    .list-pane {
      flex: 0 0 52%;
      width: 52%;
      overflow-y: auto;
      background: var(--bg);
      border-right: 1px solid var(--border);
      padding: 12px 14px 24px;
      -webkit-overflow-scrolling: touch;
    }
    .map-pane {
      flex: 0 0 48%;
      width: 48%;
      position: relative;
      min-height: 0;
    }
    #map {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    /* —— Cards —— */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 12px;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: border-color .15s, box-shadow .15s, transform .15s;
      display: grid;
      grid-template-columns: 160px 1fr;
      min-height: 128px;
    }
    .card:hover {
      border-color: #cbd5e1;
      box-shadow: 0 4px 16px rgba(0,0,0,.1);
    }
    .card.selected {
      border-color: var(--green);
      box-shadow: 0 0 0 2px rgba(34,197,94,.35), var(--shadow);
    }
    .card-photo {
      background: #e5e7eb;
      position: relative;
      overflow: hidden;
      min-height: 128px;
    }
    .card-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      position: absolute;
      inset: 0;
    }
    .card-photo .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9ca3af;
      font-size: 12px;
      background: linear-gradient(135deg, #e5e7eb, #f3f4f6);
    }
    .photo-count {
      position: absolute;
      left: 8px;
      bottom: 8px;
      z-index: 2;
      background: rgba(17, 24, 39, .72);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 999px;
      pointer-events: none;
    }
    .card-body {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .card-title {
      font-size: 15px;
      font-weight: 650;
      line-height: 1.3;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-loc {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-price {
      font-size: 16px;
      font-weight: 700;
      color: var(--green-dark);
      margin-top: 2px;
    }
    .card-price.unset { color: var(--muted); font-weight: 600; font-size: 14px; }
    .card-meta {
      font-size: 12px;
      color: #374151;
      display: flex;
      flex-wrap: wrap;
      gap: 4px 10px;
    }
    .card-meta span::before {
      content: "";
    }
    .card-notes {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-top: 2px;
    }
    .empty-state {
      text-align: center;
      padding: 48px 16px;
      color: var(--muted);
      font-size: 14px;
    }

    /* —— Map overlay card —— */
    .map-overlay {
      position: absolute;
      z-index: 500;
      left: 12px;
      right: 12px;
      bottom: 16px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: 0 8px 28px rgba(0,0,0,.18);
      display: none;
      overflow: hidden;
      border: 1px solid var(--border);
      max-width: 360px;
      margin: 0 auto;
    }
    .map-overlay.open { display: grid; grid-template-columns: 110px 1fr; }
    .map-overlay .ov-photo {
      background: #e5e7eb;
      position: relative;
      min-height: 100px;
    }
    .map-overlay .ov-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      inset: 0;
    }
    .map-overlay .ov-photo .placeholder {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: #9ca3af; font-size: 11px;
    }
    .ov-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 3;
      width: 22px;
      height: 22px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,.94);
      box-shadow: 0 1px 3px rgba(0,0,0,.25);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      color: #111827;
      padding: 0;
    }
    .ov-nav.prev { left: 4px; }
    .ov-nav.next { right: 4px; }
    .ov-nav:hover { background: #fff; }
    .map-overlay .ov-body { padding: 10px 36px 10px 12px; position: relative; min-width: 0; }
    .map-overlay .ov-close {
      position: absolute;
      top: 6px; right: 6px;
      width: 28px; height: 28px;
      border: none; border-radius: 50%;
      background: #f3f4f6;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      color: #374151;
    }
    .map-overlay .ov-close:hover { background: #e5e7eb; }
    .map-overlay .ov-price {
      font-weight: 700;
      color: var(--green-dark);
      font-size: 14px;
    }
    .map-overlay .ov-title {
      font-weight: 650;
      font-size: 13px;
      margin: 2px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .map-overlay .ov-loc,
    .map-overlay .ov-meta {
      font-size: 11px;
      color: var(--muted);
    }

    /* —— Search as I move —— */
    .map-controls {
      position: absolute;
      z-index: 400;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,.96);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 14px;
      box-shadow: var(--shadow);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .map-controls input { accent-color: var(--green); }

    /* —— Custom circle markers —— */
    .pin-marker {
      background: transparent !important;
      border: none !important;
    }
    .pin-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--green);
      border: 3px solid #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,.35);
      box-sizing: border-box;
    }
    .pin-dot.selected {
      background: var(--green-dark);
      width: 22px;
      height: 22px;
      border-width: 3px;
      box-shadow: 0 0 0 3px rgba(34,197,94,.35), 0 1px 4px rgba(0,0,0,.35);
    }

    /* —— Mobile toggle —— */
    .mobile-toggle {
      display: none;
      flex: 0 0 auto;
      border-top: 1px solid var(--border);
      background: #fff;
      padding: 8px;
      gap: 8px;
      z-index: 30;
    }
    .mobile-toggle .btn {
      flex: 1;
      height: 40px;
    }
    .mobile-toggle .btn.active {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }

    @media (max-width: 820px) {
      .list-pane, .map-pane {
        flex: 1 1 100%;
        width: 100%;
      }
      .map-pane { display: none; }
      .list-pane { display: block; }
      body.view-map .list-pane { display: none; }
      body.view-map .map-pane { display: block; }
      .mobile-toggle { display: flex; }
      .card { grid-template-columns: 120px 1fr; }
      .filters input[type="search"] { flex: 1 1 100%; }
      .result-count { margin-left: 0; width: 100%; }
      .map-overlay { max-width: none; }
    }
    @media (max-width: 480px) {
      .card { grid-template-columns: 1fr; }
      .card-photo { min-height: 160px; height: 160px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-row1">
      <h1>Thailand Rental Map</h1>
      <span class="loc-label">Bangkok, Thailand</span>
    </div>
    <div class="filters" id="filters">
      <input type="search" id="q" placeholder="Search title, area, building…" aria-label="Search listings">
      <div class="price-group" title="Price range THB/month">
        <input type="number" id="priceMin" placeholder="Min ฿" min="0" step="1000" aria-label="Minimum price THB">
        <span>–</span>
        <input type="number" id="priceMax" placeholder="Max ฿" min="0" step="1000" aria-label="Maximum price THB">
      </div>
      <select id="beds" aria-label="Bedrooms">
        <option value="">Any beds</option>
        <option value="1">1 bed</option>
        <option value="2">2 beds</option>
        <option value="3">3+ beds</option>
      </select>
      <select id="ptype" aria-label="Property type">
        <option value="">Any type</option>
        <option value="condo">Condo</option>
        <option value="apartment">Apartment</option>
        <option value="house">House</option>
      </select>
      <button type="button" class="btn btn-reset" id="resetBtn">Reset</button>
      <div class="result-count" id="resultCount" role="status">—</div>
    </div>
  </header>

  <div class="main">
    <aside class="list-pane" id="listPane" aria-label="Rental listings"></aside>
    <section class="map-pane" aria-label="Map">
      <div id="map"></div>
      <label class="map-controls">
        <input type="checkbox" id="searchAsMove">
        Search as I move the map
      </label>
      <div class="map-overlay" id="mapOverlay" role="dialog" aria-live="polite">
        <div class="ov-photo" id="ovPhoto"></div>
        <div class="ov-body">
          <button type="button" class="ov-close" id="ovClose" aria-label="Close">×</button>
          <div class="ov-price" id="ovPrice"></div>
          <div class="ov-title" id="ovTitle"></div>
          <div class="ov-loc" id="ovLoc"></div>
          <div class="ov-meta" id="ovMeta"></div>
        </div>
      </div>
    </section>
  </div>

  <nav class="mobile-toggle" aria-label="View switcher">
    <button type="button" class="btn active" id="btnList" data-view="list">List</button>
    <button type="button" class="btn" id="btnMap" data-view="map">Map</button>
  </nav>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
(function () {
  const BANGKOK = [13.7563, 100.5018];
  const PLACEHOLDER = '<div class="placeholder">No photo</div>';

  const esc = (v) => String(v ?? "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

  const priceText = (l) => l.price_thb == null
    ? "Rent not set"
    : `${Number(l.price_thb).toLocaleString("en-US")} THB/mo`;

  const typeLabel = (t) => {
    if (!t) return "";
    const s = String(t).toLowerCase();
    if (s.includes("condo")) return "Condo";
    if (s.includes("apart")) return "Apartment";
    if (s.includes("house") || s.includes("villa") || s.includes("town")) return "House";
    return t.charAt(0).toUpperCase() + t.slice(1);
  };

  const normType = (t) => {
    const s = String(t || "").toLowerCase();
    if (s.includes("condo")) return "condo";
    if (s.includes("apart")) return "apartment";
    if (s.includes("house") || s.includes("villa") || s.includes("town")) return "house";
    return s;
  };

  const photoSrc = (l, i = 0) => {
    if (Array.isArray(l.photo_data) && l.photo_data[i]) return l.photo_data[i];
    if (Array.isArray(l.photo_urls) && l.photo_urls[i]) {
      const u = l.photo_urls[i];
      if (/^(data:|https?:|blob:)/i.test(u)) return u;
      return u.replace(/^\.\//, "").replace(/^\.\.\//, "").replace(/^\//, "");
    }
    return null;
  };

  const photoCount = (l) => {
    const n = Math.max(
      Array.isArray(l.photo_urls) ? l.photo_urls.length : 0,
      Array.isArray(l.photo_data) ? l.photo_data.length : 0
    );
    let c = 0;
    for (let i = 0; i < n; i++) if (photoSrc(l, i)) c++;
    return c;
  };

  const shortNotes = (l) => {
    const n = (l.raw_notes || "").trim();
    if (!n) return "";
    return n.length > 140 ? n.slice(0, 137) + "…" : n;
  };

  const circleIcon = (selected) => L.divIcon({
    className: "pin-marker",
    html: `<div class="pin-dot${selected ? " selected" : ""}"></div>`,
    iconSize: selected ? [22, 22] : [18, 18],
    iconAnchor: selected ? [11, 11] : [9, 9],
  });

  // —— State ——
  let allListings = [];
  let selectedId = null;
  let suppressMoveFilter = false;
  const markersById = new Map();
  const markerLayer = L.layerGroup();

  const el = {
    list: document.getElementById("listPane"),
    q: document.getElementById("q"),
    priceMin: document.getElementById("priceMin"),
    priceMax: document.getElementById("priceMax"),
    beds: document.getElementById("beds"),
    ptype: document.getElementById("ptype"),
    reset: document.getElementById("resetBtn"),
    count: document.getElementById("resultCount"),
    searchAsMove: document.getElementById("searchAsMove"),
    overlay: document.getElementById("mapOverlay"),
    ovPhoto: document.getElementById("ovPhoto"),
    ovPrice: document.getElementById("ovPrice"),
    ovTitle: document.getElementById("ovTitle"),
    ovLoc: document.getElementById("ovLoc"),
    ovMeta: document.getElementById("ovMeta"),
    ovClose: document.getElementById("ovClose"),
    btnList: document.getElementById("btnList"),
    btnMap: document.getElementById("btnMap"),
  };

  const map = L.map("map", { zoomControl: true }).setView(BANGKOK, 11);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors",
  }).addTo(map);
  markerLayer.addTo(map);

  function matchesFilters(l, bounds) {
    const q = el.q.value.trim().toLowerCase();
    if (q) {
      const blob = [
        l.title, l.neighborhood, l.district, l.city,
        l.property_type, l.raw_notes, l.source,
        ...(l.photo_urls || []),
      ].filter(Boolean).join(" ").toLowerCase();
      if (!blob.includes(q)) return false;
    }

    const min = el.priceMin.value !== "" ? Number(el.priceMin.value) : null;
    const max = el.priceMax.value !== "" ? Number(el.priceMax.value) : null;
    if (min != null || max != null) {
      if (l.price_thb == null) return false;
      if (min != null && Number(l.price_thb) < min) return false;
      if (max != null && Number(l.price_thb) > max) return false;
    }

    const beds = el.beds.value;
    if (beds === "1" && !(l.bedrooms === 1)) return false;
    if (beds === "2" && !(l.bedrooms === 2)) return false;
    if (beds === "3" && !(Number(l.bedrooms) >= 3)) return false;

    const pt = el.ptype.value;
    if (pt && normType(l.property_type) !== pt) return false;

    if (bounds && el.searchAsMove.checked) {
      if (!Number.isFinite(Number(l.lat)) || !Number.isFinite(Number(l.lng))) return false;
      if (!bounds.contains([Number(l.lat), Number(l.lng)])) return false;
    }
    return true;
  }

  function filtered() {
    const bounds = el.searchAsMove.checked ? map.getBounds() : null;
    return allListings.filter((l) => matchesFilters(l, bounds));
  }

  function metaParts(l) {
    const parts = [];
    if (l.bedrooms != null) parts.push(`${l.bedrooms} bed${l.bedrooms === 1 ? "" : "s"}`);
    if (l.bathrooms != null) parts.push(`${l.bathrooms} bath${l.bathrooms === 1 ? "" : "s"}`);
    if (l.size_sqm != null) parts.push(`${l.size_sqm} sqm`);
    const tl = typeLabel(l.property_type);
    if (tl) parts.push(tl);
    return parts;
  }

  function renderList(items) {
    el.count.innerHTML = `<strong>${items.length}</strong> result${items.length === 1 ? "" : "s"}`;
    if (!items.length) {
      el.list.innerHTML = `<div class="empty-state">No listings match your filters.</div>`;
      return;
    }
    el.list.innerHTML = items.map((l) => {
      const src = photoSrc(l, 0);
      const place = [l.neighborhood, l.district].filter(Boolean).join(" · ");
      const notes = shortNotes(l);
      const unset = l.price_thb == null;
      const nPhotos = photoCount(l);
      return `<article class="card${l.id === selectedId ? " selected" : ""}" data-id="${esc(l.id)}" tabindex="0" role="button">
        <div class="card-photo">${src ? `<img src="${esc(src)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'placeholder',textContent:'No photo'}))">` : PLACEHOLDER}${nPhotos > 1 ? `<span class="photo-count">${nPhotos} photos</span>` : ""}</div>
        <div class="card-body">
          <h2 class="card-title">${esc(l.title || "Untitled")}</h2>
          <div class="card-loc">${esc(place || l.city || "Bangkok")}</div>
          <div class="card-price${unset ? " unset" : ""}">${esc(priceText(l))}</div>
          <div class="card-meta">${esc(metaParts(l).join(" · "))}</div>
          ${notes ? `<div class="card-notes">${esc(notes)}</div>` : ""}
        </div>
      </article>`;
    }).join("");
  }

  function syncMarkers(items) {
    markerLayer.clearLayers();
    markersById.clear();
    items.forEach((l) => {
      if (!Number.isFinite(Number(l.lat)) || !Number.isFinite(Number(l.lng))) return;
      const m = L.marker([Number(l.lat), Number(l.lng)], {
        icon: circleIcon(l.id === selectedId),
        title: l.title || "",
      });
      m.on("click", () => selectListing(l.id, { fromMap: true }));
      m.addTo(markerLayer);
      markersById.set(l.id, m);
    });
  }

  let overlayListing = null;
  let overlayPhotoIndex = 0;

  function renderOverlayPhoto() {
    if (!overlayListing) return;
    const n = photoCount(overlayListing);
    const src = photoSrc(overlayListing, overlayPhotoIndex);
    const nav = n > 1
      ? `<button type="button" class="ov-nav prev" data-dir="-1" aria-label="Previous photo">‹</button><button type="button" class="ov-nav next" data-dir="1" aria-label="Next photo">›</button><span class="photo-count">${overlayPhotoIndex + 1} / ${n}</span>`
      : "";
    el.ovPhoto.innerHTML = (src
      ? `<img src="${esc(src)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'placeholder',textContent:'No photo'}))">`
      : PLACEHOLDER) + nav;
  }

  function openOverlay(l) {
    overlayListing = l;
    overlayPhotoIndex = 0;
    renderOverlayPhoto();
    el.ovPrice.textContent = priceText(l);
    el.ovTitle.textContent = l.title || "Untitled";
    el.ovLoc.textContent = [l.neighborhood, l.district].filter(Boolean).join(" · ") || (l.city || "Bangkok");
    el.ovMeta.textContent = metaParts(l).join(" · ");
    el.overlay.classList.add("open");
  }

  function closeOverlay() {
    el.overlay.classList.remove("open");
    overlayListing = null;
    overlayPhotoIndex = 0;
  }

  function selectListing(id, opts = {}) {
    const l = allListings.find((x) => x.id === id);
    if (!l) return;
    selectedId = id;

    // Update card highlight + scroll
    el.list.querySelectorAll(".card").forEach((c) => {
      c.classList.toggle("selected", c.dataset.id === id);
    });
    const card = el.list.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
    if (card && opts.fromMap) {
      card.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    // Update markers
    markersById.forEach((m, mid) => {
      m.setIcon(circleIcon(mid === id));
    });

    // Pan map
    if (Number.isFinite(Number(l.lat)) && Number.isFinite(Number(l.lng))) {
      suppressMoveFilter = true;
      const z = Math.max(map.getZoom(), 15);
      map.setView([Number(l.lat), Number(l.lng)], z, { animate: true });
      setTimeout(() => { suppressMoveFilter = false; }, 400);
    }

    openOverlay(l);

    if (opts.fromList && window.matchMedia("(max-width: 820px)").matches) {
      setMobileView("map");
    }
  }

  function refresh({ fit } = {}) {
    const items = filtered();
    renderList(items);
    syncMarkers(items);
    if (selectedId && !items.some((x) => x.id === selectedId)) {
      selectedId = null;
      closeOverlay();
    } else if (selectedId) {
      // re-highlight after re-render
      const card = el.list.querySelector(`.card[data-id="${CSS.escape(selectedId)}"]`);
      if (card) card.classList.add("selected");
      markersById.forEach((m, mid) => m.setIcon(circleIcon(mid === selectedId)));
    }
    if (fit) {
      const pts = items
        .filter((l) => Number.isFinite(Number(l.lat)) && Number.isFinite(Number(l.lng)))
        .map((l) => [Number(l.lat), Number(l.lng)]);
      suppressMoveFilter = true;
      if (pts.length === 1) map.setView(pts[0], 15);
      else if (pts.length > 1) map.fitBounds(pts, { padding: [40, 40] });
      else map.setView(BANGKOK, 11);
      setTimeout(() => { suppressMoveFilter = false; }, 400);
    }
  }

  function setMobileView(view) {
    document.body.classList.toggle("view-map", view === "map");
    el.btnList.classList.toggle("active", view === "list");
    el.btnMap.classList.toggle("active", view === "map");
    if (view === "map") setTimeout(() => map.invalidateSize(), 50);
  }

  // Events
  el.list.addEventListener("click", (e) => {
    const card = e.target.closest(".card");
    if (card) selectListing(card.dataset.id, { fromList: true });
  });
  el.list.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      const card = e.target.closest(".card");
      if (card) { e.preventDefault(); selectListing(card.dataset.id, { fromList: true }); }
    }
  });
  el.ovPhoto.addEventListener("click", (e) => {
    const btn = e.target.closest(".ov-nav");
    if (!btn || !overlayListing) return;
    const n = photoCount(overlayListing);
    if (n < 2) return;
    const dir = Number(btn.dataset.dir);
    overlayPhotoIndex = (overlayPhotoIndex + dir + n) % n;
    renderOverlayPhoto();
  });
  el.ovClose.addEventListener("click", () => {
    closeOverlay();
    selectedId = null;
    markersById.forEach((m) => m.setIcon(circleIcon(false)));
    el.list.querySelectorAll(".card.selected").forEach((c) => c.classList.remove("selected"));
  });

  ["input", "change"].forEach((ev) => {
    [el.q, el.priceMin, el.priceMax, el.beds, el.ptype].forEach((node) => {
      node.addEventListener(ev, () => refresh());
    });
  });
  el.searchAsMove.addEventListener("change", () => refresh());
  el.reset.addEventListener("click", () => {
    el.q.value = "";
    el.priceMin.value = "";
    el.priceMax.value = "";
    el.beds.value = "";
    el.ptype.value = "";
    el.searchAsMove.checked = false;
    selectedId = null;
    closeOverlay();
    refresh({ fit: true });
  });

  map.on("moveend", () => {
    if (suppressMoveFilter) return;
    if (el.searchAsMove.checked) refresh();
  });

  el.btnList.addEventListener("click", () => setMobileView("list"));
  el.btnMap.addEventListener("click", () => setMobileView("map"));

  // —— Data load ——
  // Embedded mode: window.__LISTINGS__ may be set by self-contained twin
  const boot = (listings) => {
    allListings = Array.isArray(listings) ? listings : [];
    refresh({ fit: true });
    if (allListings.length === 1 && Number.isFinite(Number(allListings[0].lat))) {
      selectListing(allListings[0].id);
    }
    setTimeout(() => map.invalidateSize(), 100);
  };

  if (Array.isArray(window.__LISTINGS__)) {
    boot(window.__LISTINGS__);
  } else {
    fetch("data/listings.json")
      .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(boot)
      .catch((err) => {
        console.error(err);
        el.list.innerHTML = `<div class="empty-state">Listings could not be loaded.</div>`;
        el.count.textContent = "Error loading";
      });
  }
})();
  </script>
</body>
</html>
