<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thailand Rental Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <style>
    :root {
      --green: #22c55e;
      --green-dark: #16a34a;
      --border: #e5e7eb;
      --muted: #6b7280;
      --text: #111827;
      --bg: #f8fafc;
      --card: #ffffff;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.04);
      --radius: 12px;
      --topbar-h: auto;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    body { display: flex; flex-direction: column; overflow: hidden; }

    /* —— Top bar —— */
    .topbar {
      flex: 0 0 auto;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px 12px;
      z-index: 20;
    }
    .topbar-row1 {
      display: flex;
      align-items: center;
      gap: 8px 12px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .topbar h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .loc-label {
      display: flex;
      align-items: baseline;
      gap: 4px;
      flex: 1 0 100%;
      max-width: 100%;
      min-width: 0;
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }
    .loc-label::before {
      content: "📍";
      font-size: 12px;
      flex: 0 0 auto;
    }
    .loc-areas {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      flex: 1 1 0;
      min-width: 0;
      max-width: 100%;
    }
    .loc-areas span { white-space: nowrap; }
    .loc-areas span:not(:last-child)::after {
      content: " · ";
      color: #9ca3af;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .filters input[type="search"],
    .filters input[type="number"],
    .filters select {
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 10px;
      font: inherit;
      font-size: 13px;
      background: #fff;
      color: var(--text);
      outline: none;
    }
    .filters input[type="search"]:focus,
    .filters input[type="number"]:focus,
    .filters select:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(34,197,94,.15);
    }
    .search-wrap {
      position: relative;
      flex: 1 1 220px;
      min-width: 180px;
    }
    .search-wrap input[type="search"] { width: 100%; min-width: 0; }
    .suggest {
      position: absolute;
      z-index: 40;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      min-width: 280px;
      max-height: 320px;
      overflow: auto;
      margin: 0;
      padding: 4px;
      list-style: none;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
    }
    .suggest[hidden] { display: none; }
    .suggest li {
      display: flex;
      flex-direction: column;
      gap: 1px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
    }
    .suggest li.active,
    .suggest li:hover { background: #f0fdf4; }
    .suggest .s-top {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .suggest .s-name {
      font-weight: 650;
      font-size: 13px;
      min-width: 0;
    }
    .suggest .s-units {
      margin-left: auto;
      font-size: 12px;
      color: var(--green-dark);
      white-space: nowrap;
    }
    .suggest .s-units.none { color: var(--muted); font-weight: 500; }
    .suggest .s-sub { font-size: 12px; color: var(--muted); }
    .osm-note {
      flex: 1 0 100%;
      margin: 0;
      font-size: 11px;
      color: var(--muted);
    }
    .osm-note a { color: inherit; }
    .building-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .building-banner .banner-copy { min-width: 0; }
    .building-banner strong {
      display: block;
      font-size: 14px;
    }
    .building-banner span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }
    .filters input[type="number"] { width: 100px; }
    .price-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .price-group span { color: var(--muted); font-size: 12px; }
    .btn {
      height: 36px;
      padding: 0 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text);
    }
    .btn:hover { background: #f3f4f6; }
    .btn-reset { color: var(--muted); }
    .result-count {
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      margin-left: auto;
    }
    .result-count strong { color: var(--text); }

    /* —— Layout —— */
    .main {
      flex: 1 1 auto;
      display: flex;
      min-height: 0;
      position: relative;
    }
    .list-pane {
      flex: 0 0 52%;
      width: 52%;
      overflow-y: auto;
      background: var(--bg);
      border-right: 1px solid var(--border);
      padding: 12px 14px 24px;
      -webkit-overflow-scrolling: touch;
    }
    .map-pane {
      flex: 0 0 48%;
      width: 48%;
      position: relative;
      min-height: 0;
      z-index: 1;
    }
    #map {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    /* —— Cards —— */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 12px;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: border-color .15s, box-shadow .15s, transform .15s;
      display: grid;
      grid-template-columns: 160px 1fr;
      min-height: 128px;
    }
    .card:hover {
      border-color: #cbd5e1;
      box-shadow: 0 4px 16px rgba(0,0,0,.1);
    }
    .card.selected {
      border-color: var(--green);
      box-shadow: 0 0 0 2px rgba(34,197,94,.35), var(--shadow);
    }
    .card-photo {
      background: #e5e7eb;
      position: relative;
      overflow: hidden;
      min-height: 128px;
    }
    .card-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      position: absolute;
      inset: 0;
    }
    .card-photo .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9ca3af;
      font-size: 12px;
      background: linear-gradient(135deg, #e5e7eb, #f3f4f6);
    }
    .photo-count {
      position: absolute;
      left: 8px;
      bottom: 8px;
      z-index: 2;
      background: rgba(17, 24, 39, .72);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 999px;
      pointer-events: none;
    }
    .card-body {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .card-title {
      font-size: 15px;
      font-weight: 650;
      line-height: 1.3;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-loc {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-price {
      font-size: 16px;
      font-weight: 700;
      color: var(--green-dark);
      margin-top: 2px;
    }
    .card-price.unset { color: var(--muted); font-weight: 600; font-size: 14px; }
    .card-meta {
      font-size: 12px;
      color: #374151;
      display: flex;
      flex-wrap: wrap;
      gap: 4px 10px;
    }
    .card-meta span::before {
      content: "";
    }
    .card-notes {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-top: 2px;
    }
    .empty-state {
      text-align: center;
      padding: 48px 16px;
      color: var(--muted);
      font-size: 14px;
    }

    /* —— Map overlay card —— */
    .map-overlay {
      position: absolute;
      z-index: 500;
      left: 12px;
      right: 12px;
      bottom: 16px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: 0 8px 28px rgba(0,0,0,.18);
      display: none;
      overflow: hidden;
      border: 1px solid var(--border);
      max-width: 360px;
      margin: 0 auto;
    }
    .map-overlay.open { display: grid; grid-template-columns: 110px 1fr; }
    .map-overlay .ov-photo {
      background: #e5e7eb;
      position: relative;
      min-height: 100px;
    }
    .map-overlay .ov-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      inset: 0;
    }
    .map-overlay .ov-photo .placeholder {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: #9ca3af; font-size: 11px;
    }
    .ov-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 3;
      width: 22px;
      height: 22px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,.94);
      box-shadow: 0 1px 3px rgba(0,0,0,.25);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      color: #111827;
      padding: 0;
    }
    .ov-nav.prev { left: 4px; }
    .ov-nav.next { right: 4px; }
    .ov-nav:hover { background: #fff; }
    .map-overlay .ov-body { padding: 10px 36px 10px 12px; position: relative; min-width: 0; }
    .map-overlay .ov-close {
      position: absolute;
      top: 6px; right: 6px;
      width: 28px; height: 28px;
      border: none; border-radius: 50%;
      background: #f3f4f6;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      color: #374151;
    }
    .map-overlay .ov-close:hover { background: #e5e7eb; }
    .map-overlay .ov-price {
      font-weight: 700;
      color: var(--green-dark);
      font-size: 14px;
    }
    .map-overlay .ov-title {
      font-weight: 650;
      font-size: 13px;
      margin: 2px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .map-overlay .ov-loc,
    .map-overlay .ov-meta {
      font-size: 11px;
      color: var(--muted);
    }
    .ov-details {
      margin-top: 6px;
      padding: 0;
      border: none;
      background: none;
      color: var(--green-dark);
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .ov-details:hover { text-decoration: underline; }

    /* —— Listing detail (covers the list; map stays put) —— */
    .detail-pane {
      position: absolute;
      z-index: 5;
      top: 0;
      left: 0;
      bottom: 0;
      width: 52%;
      background: var(--bg);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .detail-pane[hidden] { display: none !important; }
    .detail-bar {
      position: sticky;
      top: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: rgba(248, 250, 252, .96);
      border-bottom: 1px solid var(--border);
    }
    .detail-map { display: none; }
    .detail-inner { padding: 12px 14px 32px; }
    .detail-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .gallery-frame {
      position: relative;
      background: #111827;
      width: 100%;
      aspect-ratio: 4 / 3;
      max-height: 72vh;
      overflow: hidden;
    }
    .gallery-track {
      position: absolute;
      inset: 0;
      display: flex;
      height: auto;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
      overscroll-behavior-x: contain;
      touch-action: pan-x;
    }
    .gallery-track::-webkit-scrollbar { display: none; }
    .gallery-slide {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: zoom-in;
    }
    .gallery-slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      cursor: zoom-in;
      user-select: none;
      -webkit-user-drag: none;
    }
    .gallery-frame .placeholder {
      color: #9ca3af;
      font-size: 14px;
    }
    .gal-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 2;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,.94);
      box-shadow: 0 1px 4px rgba(0,0,0,.28);
      cursor: pointer;
      font-size: 22px;
      line-height: 1;
      color: #111827;
      padding: 0;
    }
    .gal-nav.prev { left: 10px; }
    .gal-nav.next { right: 10px; }
    .gal-nav:hover { background: #fff; }
    .gallery-frame .photo-count {
      font-size: 13px;
      padding: 4px 10px;
    }
    .thumbs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 12px 0;
      scrollbar-width: thin;
    }
    .thumb {
      flex: 0 0 auto;
      width: 84px;
      height: 64px;
      padding: 0;
      border: 2px solid transparent;
      border-radius: 8px;
      overflow: hidden;
      background: #e5e7eb;
      cursor: zoom-in;
    }
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }
    .thumb[aria-current="true"] { border-color: var(--green); }
    .gallery-hint {
      margin: 6px 12px 0;
      font-size: 12px;
      color: var(--muted);
    }
    .detail-copy { padding: 14px 16px 18px; }
    .detail-title {
      margin: 0;
      font-size: 20px;
      line-height: 1.3;
      letter-spacing: -0.02em;
    }
    .detail-loc {
      margin-top: 4px;
      font-size: 13px;
      color: var(--muted);
    }
    .detail-price-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .detail-price {
      font-size: 22px;
      font-weight: 750;
      color: var(--green-dark);
    }
    .detail-price.unset {
      color: var(--muted);
      font-size: 16px;
      font-weight: 650;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: #f3f4f6;
      color: #374151;
    }
    .status-pill.status-available { background: #dcfce7; color: #166534; }
    .status-pill.status-unknown { background: #fef3c7; color: #92400e; }
    .status-pill.status-gone { background: #fee2e2; color: #991b1b; }
    .detail-specs {
      margin-top: 6px;
      font-size: 14px;
      color: #374151;
    }
    .facts { margin: 14px 0 0; }
    .fact {
      display: grid;
      grid-template-columns: 8.25rem 1fr;
      gap: 8px;
      padding: 8px 0;
      border-top: 1px solid var(--border);
      font-size: 14px;
    }
    .fact dt { margin: 0; color: var(--muted); }
    .fact dd { margin: 0; overflow-wrap: anywhere; }
    .fact-muted dd { color: var(--muted); }
    .fact a {
      color: var(--green-dark);
      font-weight: 700;
      margin-left: 8px;
    }
    .detail-notes {
      margin: 14px 0 0;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 14px;
      line-height: 1.5;
      color: #374151;
      white-space: pre-wrap;
    }
    .detail-notes h3 {
      margin: 0 0 6px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* —— Fullscreen photo lightbox —— */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(17, 24, 39, .94);
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }
    .lightbox[hidden] { display: none !important; }
    .lightbox img {
      max-width: min(1100px, 92vw);
      max-height: 82vh;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }
    .lb-close,
    .lb-nav {
      position: absolute;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,.95);
      color: #111827;
      cursor: pointer;
      line-height: 1;
      padding: 0;
    }
    .lb-close {
      top: 16px;
      right: 16px;
      width: 40px;
      height: 40px;
      font-size: 24px;
    }
    .lb-nav {
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      font-size: 28px;
    }
    .lb-nav.prev { left: 16px; }
    .lb-nav.next { right: 16px; }
    .lb-close:hover, .lb-nav:hover { background: #fff; }
    .lb-counter {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      background: rgba(0,0,0,.5);
      padding: 4px 12px;
      border-radius: 999px;
      font-weight: 650;
      font-size: 14px;
    }

    /* —— Search as I move —— */
    .map-controls {
      position: absolute;
      z-index: 400;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,.96);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 14px;
      box-shadow: var(--shadow);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .map-controls input { accent-color: var(--green); }

    /* —— Custom circle markers —— */
    .pin-marker {
      background: transparent !important;
      border: none !important;
    }
    .pin-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--green);
      border: 3px solid #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,.35);
      box-sizing: border-box;
    }
    .pin-dot.selected {
      background: var(--green-dark);
      width: 22px;
      height: 22px;
      border-width: 3px;
      box-shadow: 0 0 0 3px rgba(34,197,94,.35), 0 1px 4px rgba(0,0,0,.35);
    }
    .pin-dot.pin-count {
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      border-width: 2px;
    }
    .pin-dot.pin-count.selected {
      width: 30px;
      height: 30px;
      background: var(--green-dark);
    }
    .pin-dot.pin-empty {
      width: 12px;
      height: 12px;
      background: #fff;
      border: 2px solid #94a3b8;
      box-shadow: 0 1px 2px rgba(0,0,0,.25);
    }
    .pin-dot.pin-empty.selected {
      width: 16px;
      height: 16px;
      border-color: var(--green-dark);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(34,197,94,.35);
    }

    /* —— Mobile toggle —— */
    .mobile-toggle {
      display: none;
      flex: 0 0 auto;
      border-top: 1px solid var(--border);
      background: #fff;
      padding: 8px;
      gap: 8px;
      z-index: 30;
    }
    .mobile-toggle .btn {
      flex: 1;
      height: 40px;
    }
    .mobile-toggle .btn.active {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }

    @media (max-width: 820px) {
      .list-pane, .map-pane {
        flex: 1 1 100%;
        width: 100%;
      }
      .map-pane { display: none; }
      .list-pane { display: block; }
      body.view-map .list-pane { display: none; }
      body.view-map .map-pane { display: block; }
      .mobile-toggle { display: flex; }
      .card { grid-template-columns: 120px 1fr; }
      .loc-label { font-size: 12px; }
      .filters input[type="search"] { flex: 1 1 100%; }
      .search-wrap { flex: 1 1 100%; }
      .suggest { min-width: 0; }
      .result-count { margin-left: 0; width: 100%; }
      .map-overlay { max-width: none; }
      .detail-pane { width: 100%; border-right: none; }
      body.view-map .detail-pane { display: none !important; }
      .detail-map { display: inline-flex; align-items: center; }
    }
    @media (max-width: 480px) {
      .card { grid-template-columns: 1fr; }
      .card-photo { min-height: 160px; height: 160px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-row1">
      <h1>Thailand Rental Map</h1>
      <p class="loc-label">
        <span class="loc-areas">
          <span>Sukhumvit (Nana–Bearing)</span>
          <span>Ekamai</span>
          <span>Ari</span>
          <span>Silom–Sathorn</span>
        </span>
      </p>
      <p class="osm-note">Buildings © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors, ODbL</p>
    </div>
    <div class="filters" id="filters">
      <div class="search-wrap">
        <input type="search" id="q" placeholder="Search a condo, tower, or listing…" aria-label="Search buildings and listings" role="combobox" aria-expanded="false" aria-controls="suggest" aria-autocomplete="list" autocomplete="off">
        <ul id="suggest" class="suggest" role="listbox" hidden></ul>
      </div>
      <div class="price-group" title="Price range THB/month">
        <input type="number" id="priceMin" placeholder="Min ฿" min="0" step="1000" aria-label="Minimum price THB">
        <span>–</span>
        <input type="number" id="priceMax" placeholder="Max ฿" min="0" step="1000" aria-label="Maximum price THB">
      </div>
      <select id="beds" aria-label="Bedrooms">
        <option value="">Any beds</option>
        <option value="1">1 bed</option>
        <option value="2">2 beds</option>
        <option value="3">3+ beds</option>
      </select>
      <select id="ptype" aria-label="Property type">
        <option value="">Any type</option>
        <option value="condo">Condo</option>
        <option value="apartment">Apartment</option>
        <option value="house">House</option>
      </select>
      <button type="button" class="btn btn-reset" id="resetBtn">Reset</button>
      <div class="result-count" id="resultCount" role="status">—</div>
    </div>
  </header>

  <div class="main">
    <aside class="list-pane" id="listPane" aria-label="Rental listings"></aside>
    <section id="detailPane" class="detail-pane" hidden aria-labelledby="detailTitle"></section>
    <section class="map-pane" aria-label="Map">
      <div id="map"></div>
      <label class="map-controls">
        <input type="checkbox" id="searchAsMove">
        Search as I move the map
      </label>
      <div class="map-overlay" id="mapOverlay" role="dialog" aria-live="polite">
        <div class="ov-photo" id="ovPhoto"></div>
        <div class="ov-body">
          <button type="button" class="ov-close" id="ovClose" aria-label="Close">×</button>
          <div class="ov-price" id="ovPrice"></div>
          <div class="ov-title" id="ovTitle"></div>
          <div class="ov-loc" id="ovLoc"></div>
          <div class="ov-meta" id="ovMeta"></div>
          <button type="button" class="ov-details" id="ovDetails">View details</button>
        </div>
      </div>
    </section>
  </div>

  <nav class="mobile-toggle" aria-label="View switcher">
    <button type="button" class="btn active" id="btnList" data-view="list">List</button>
    <button type="button" class="btn" id="btnMap" data-view="map">Map</button>
  </nav>

  <div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo gallery">
    <button type="button" class="lb-close" id="lbClose" aria-label="Close photos">×</button>
    <button type="button" class="lb-nav prev" id="lbPrev" aria-label="Previous photo">‹</button>
    <button type="button" class="lb-nav next" id="lbNext" aria-label="Next photo">›</button>
    <img id="lbImg" alt="">
    <div class="lb-counter" id="lbCounter" aria-live="polite"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
(function () {
  const BANGKOK = [13.7563, 100.5018];
  const PLACEHOLDER = '<div class="placeholder">No photo</div>';
  const EMPTY_ZOOM = 16;

  const esc = (v) => String(v ?? "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

  const fold = (v) => String(v ?? "")
    .toLowerCase()
    .normalize("NFKC")
    .replace(/[^\p{L}\p{N}]+/gu, "");

  const priceText = (l) => l.price_thb == null
    ? "Rent not set"
    : `${Number(l.price_thb).toLocaleString("en-US")} THB/mo`;

  const typeLabel = (t) => {
    if (!t) return "";
    const s = String(t).toLowerCase();
    if (s.includes("condo")) return "Condo";
    if (s.includes("apart")) return "Apartment";
    if (s.includes("house") || s.includes("villa") || s.includes("town")) return "House";
    return t.charAt(0).toUpperCase() + t.slice(1);
  };

  const normType = (t) => {
    const s = String(t || "").toLowerCase();
    if (s.includes("condo")) return "condo";
    if (s.includes("apart")) return "apartment";
    if (s.includes("house") || s.includes("villa") || s.includes("town")) return "house";
    return s;
  };

  const photoSrc = (l, i = 0) => {
    if (Array.isArray(l.photo_data) && l.photo_data[i]) return l.photo_data[i];
    if (Array.isArray(l.photo_urls) && l.photo_urls[i]) {
      const u = l.photo_urls[i];
      if (/^(data:|https?:|blob:)/i.test(u)) return u;
      return u.replace(/^\.\//, "").replace(/^\.\.\//, "").replace(/^\//, "");
    }
    return null;
  };

  const photoCount = (l) => photoList(l).length;

  const photoList = (l) => {
    if (!l) return [];
    const n = Math.max(
      Array.isArray(l.photo_urls) ? l.photo_urls.length : 0,
      Array.isArray(l.photo_data) ? l.photo_data.length : 0
    );
    const out = [];
    for (let i = 0; i < n; i++) {
      const src = photoSrc(l, i);
      if (src) out.push(src);
    }
    return out;
  };

  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const formatWhen = (v) => {
    if (v == null || String(v).trim() === "") return "";
    const s = String(v).trim();
    const day = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!day) return s;
    const month = MONTHS[Number(day[2]) - 1] || day[2];
    const date = `${Number(day[3])} ${month} ${day[1]}`;
    const time = s.match(/T(\d{2}):(\d{2})/);
    return time && s.length > 10 ? `${date}, ${time[1]}:${time[2]}` : date;
  };

  const STATUS_LABEL = {
    available: "Available",
    unknown: "Unknown",
    gone: "No longer listed",
  };

  const detailPrice = (l) => {
    if (l.price_thb == null) return "Rent not set";
    const cur = l.currency || "THB";
    return `${Number(l.price_thb).toLocaleString("en-US")} ${cur}/month`;
  };

  const httpUrl = (v) => /^https?:\/\//i.test(v || "") ? v : "";

  const shortNotes = (l) => {
    const n = (l.raw_notes || "").trim();
    if (!n) return "";
    return n.length > 140 ? n.slice(0, 137) + "…" : n;
  };

  const AREA_LABEL = {
    nana: "Nana",
    asok: "Asok",
    "phrom-phong": "Phrom Phong",
    "thong-lo": "Thong Lo",
    ekamai: "Ekamai",
    "phra-khanong": "Phra Khanong",
    "on-nut": "On Nut",
    "bang-chak": "Bang Chak",
    punnawithi: "Punnawithi",
    "udom-suk": "Udom Suk",
    "bang-na": "Bang Na",
    bearing: "Bearing",
    ari: "Ari",
    "silom-sathorn": "Silom–Sathorn",
  };
  let SUKHUMVIT_IDS = [
    "nana", "asok", "phrom-phong", "thong-lo", "ekamai", "phra-khanong",
    "on-nut", "bang-chak", "punnawithi", "udom-suk", "bang-na", "bearing",
  ];

  const foldedNames = new Map();
  const foldedFor = (b) => {
    let names = foldedNames.get(b.id);
    if (!names) {
      names = buildingNames(b).map(fold);
      foldedNames.set(b.id, names);
    }
    return names;
  };

  const buildingNames = (b) => b
    ? [b.name, b.name_en, b.name_th, ...(b.aliases || [])].filter(Boolean)
    : [];

  const areaText = (b) => {
    const ids = b.areas || [];
    const suk = SUKHUMVIT_IDS.filter((id) => ids.includes(id));
    const rest = ids.filter((id) => !SUKHUMVIT_IDS.includes(id));
    const parts = [];
    if (ids.includes("ekamai")) parts.push(AREA_LABEL.ekamai || "Ekamai");
    if (suk.length > 1) {
      const from = AREA_LABEL[suk[0]] || suk[0];
      const to = AREA_LABEL[suk[suk.length - 1]] || suk[suk.length - 1];
      parts.push(`Sukhumvit (${from}–${to})`);
    } else if (suk.length === 1 && suk[0] !== "ekamai") {
      parts.push(AREA_LABEL[suk[0]] || suk[0]);
    }
    rest.forEach((id) => parts.push(AREA_LABEL[id] || id));
    return parts.join(" · ");
  };

  function renderHeader(areas) {
    const locAreas = document.querySelector(".loc-areas");
    if (!locAreas) return;
    const suk = areas.filter((area) => area && area.corridor === "sukhumvit");
    if (!suk.length) return;
    const labels = [`Sukhumvit (${suk[0].name}–${suk[suk.length - 1].name})`];
    if (areas.some((area) => area && area.id === "ekamai")) labels.push(AREA_LABEL.ekamai || "Ekamai");
    areas.filter((area) => area && area.corridor && area.corridor !== "sukhumvit").forEach((area) => {
      labels.push(area.name);
    });
    locAreas.innerHTML = labels.map((name) => `<span>${esc(name)}</span>`).join("");
  }

  let allListings = [];
  let allBuildings = [];
  let areaBbox = null;
  const buildingById = new Map();
  let selectedId = null;
  let focusedBuildingId = null;
  let suppressMoveFilter = false;
  let suppressSearch = false;
  let suggestIndex = -1;
  const markersById = new Map();
  const markerLayer = L.layerGroup();

  const el = {
    list: document.getElementById("listPane"),
    q: document.getElementById("q"),
    suggest: document.getElementById("suggest"),
    priceMin: document.getElementById("priceMin"),
    priceMax: document.getElementById("priceMax"),
    beds: document.getElementById("beds"),
    ptype: document.getElementById("ptype"),
    reset: document.getElementById("resetBtn"),
    count: document.getElementById("resultCount"),
    searchAsMove: document.getElementById("searchAsMove"),
    overlay: document.getElementById("mapOverlay"),
    ovPhoto: document.getElementById("ovPhoto"),
    ovPrice: document.getElementById("ovPrice"),
    ovTitle: document.getElementById("ovTitle"),
    ovLoc: document.getElementById("ovLoc"),
    ovMeta: document.getElementById("ovMeta"),
    ovClose: document.getElementById("ovClose"),
    ovDetails: document.getElementById("ovDetails"),
    btnList: document.getElementById("btnList"),
    btnMap: document.getElementById("btnMap"),
    detail: document.getElementById("detailPane"),
    lightbox: document.getElementById("lightbox"),
    lbImg: document.getElementById("lbImg"),
    lbCounter: document.getElementById("lbCounter"),
    lbClose: document.getElementById("lbClose"),
    lbPrev: document.getElementById("lbPrev"),
    lbNext: document.getElementById("lbNext"),
  };

  const map = L.map("map", { zoomControl: true, preferCanvas: true }).setView(BANGKOK, 12);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap</a> contributors, ODbL",
  }).addTo(map);
  markerLayer.addTo(map);

  function buildingOf(listing) {
    return listing && listing.building_id ? buildingById.get(listing.building_id) : null;
  }

  function matchesStructural(l) {
    const min = el.priceMin.value !== "" ? Number(el.priceMin.value) : null;
    const max = el.priceMax.value !== "" ? Number(el.priceMax.value) : null;
    if (min != null || max != null) {
      if (l.price_thb == null) return false;
      if (min != null && Number(l.price_thb) < min) return false;
      if (max != null && Number(l.price_thb) > max) return false;
    }
    const beds = el.beds.value;
    if (beds === "1" && !(l.bedrooms === 1)) return false;
    if (beds === "2" && !(l.bedrooms === 2)) return false;
    if (beds === "3" && !(Number(l.bedrooms) >= 3)) return false;
    const pt = el.ptype.value;
    if (pt && normType(l.property_type) !== pt) return false;
    return l.status !== "gone";
  }

  function textQuery() {
    return fold(el.q.value);
  }

  function buildingMatches(b, q) {
    if (!q) return false;
    return foldedFor(b).some((name) => name.includes(q));
  }

  function listingMatchesText(l, q) {
    if (!q) return true;
    const b = buildingOf(l);
    const blob = fold([
      l.title, l.neighborhood, l.district, l.city,
      l.property_type, l.raw_notes, l.source,
      ...buildingNames(b),
    ].filter(Boolean).join(" "));
    return blob.includes(q);
  }

  function inMoveBounds(lat, lng) {
    if (!el.searchAsMove.checked) return true;
    if (!Number.isFinite(Number(lat)) || !Number.isFinite(Number(lng))) return false;
    return map.getBounds().contains([Number(lat), Number(lng)]);
  }

  function unitsFor(buildingId) {
    return allListings.filter((l) => l.building_id === buildingId && matchesStructural(l));
  }

  function suggestions() {
    const q = textQuery();
    if (q.length < 2) return [];
    const hits = [];
    allBuildings.forEach((b) => {
      const names = foldedFor(b);
      if (!names.some((name) => name.includes(q))) return;
      const starts = names.some((name) => name.startsWith(q));
      hits.push({ building: b, starts, units: unitsFor(b.id).length });
    });
    hits.sort((a, b) => {
      if ((b.units > 0) !== (a.units > 0)) return b.units > 0 ? 1 : -1;
      if (a.starts !== b.starts) return a.starts ? -1 : 1;
      return String(a.building.name).localeCompare(String(b.building.name));
    });
    return hits.slice(0, 8);
  }

  function filtered() {
    const q = focusedBuildingId ? "" : textQuery();
    return allListings.filter((l) => {
      if (!matchesStructural(l)) return false;
      if (focusedBuildingId) return l.building_id === focusedBuildingId;
      if (!listingMatchesText(l, q)) return false;
      return inMoveBounds(l.lat, l.lng);
    });
  }

  function metaParts(l) {
    const parts = [];
    if (l.bedrooms != null) parts.push(`${l.bedrooms} bed${l.bedrooms === 1 ? "" : "s"}`);
    if (l.bathrooms != null) parts.push(`${l.bathrooms} bath${l.bathrooms === 1 ? "" : "s"}`);
    if (l.size_sqm != null) parts.push(`${l.size_sqm} sqm`);
    const tl = typeLabel(l.property_type);
    if (tl) parts.push(tl);
    return parts;
  }

  function bannerHtml() {
    if (!focusedBuildingId) return "";
    const b = buildingById.get(focusedBuildingId);
    if (!b) return "";
    const n = unitsFor(b.id).length;
    const kind = b.type === "condo" ? "Condo" : b.type === "apartment" ? "Apartment" : "Building";
    const thai = b.name_th && b.name_th !== b.name ? b.name_th : "";
    const status = n === 0
      ? "No units listed yet"
      : `${n} available unit${n === 1 ? "" : "s"}`;
    return `<div class="building-banner">
      <button type="button" class="btn" id="backAll">All listings</button>
      <div class="banner-copy">
        <strong>${esc(b.name)}</strong>
        <span>${esc([areaText(b), kind, thai, status].filter(Boolean).join(" · "))}</span>
      </div>
    </div>`;
  }

  function renderList(items) {
    const focused = focusedBuildingId ? buildingById.get(focusedBuildingId) : null;
    if (focused) {
      const n = items.length;
      el.count.innerHTML = n
        ? `<strong>${n}</strong> unit${n === 1 ? "" : "s"}`
        : "No units listed yet";
    } else {
      el.count.innerHTML = `<strong>${items.length}</strong> result${items.length === 1 ? "" : "s"}`;
    }
    if (!items.length) {
      const message = focused
        ? (unitsFor(focused.id).length
          ? "No listings in this building match your filters."
          : `<strong>No units listed yet</strong><br>${esc(focused.name)} is in the directory. A home will show up here when the owner posts it.`)
        : "No listings match your filters.";
      el.list.innerHTML = `${bannerHtml()}<div class="empty-state">${message}</div>`;
      return;
    }
    el.list.innerHTML = bannerHtml() + items.map((l) => {
      const src = photoSrc(l, 0);
      const b = buildingOf(l);
      const place = [b && b.name, l.neighborhood, l.district].filter(Boolean).join(" · ");
      const notes = shortNotes(l);
      const unset = l.price_thb == null;
      const nPhotos = photoCount(l);
      return `<article class="card${l.id === selectedId ? " selected" : ""}" data-id="${esc(l.id)}" tabindex="0" role="button">
        <div class="card-photo">${src ? `<img src="${esc(src)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'placeholder',textContent:'No photo'}))">` : PLACEHOLDER}${nPhotos > 1 ? `<span class="photo-count">${nPhotos} photos</span>` : ""}</div>
        <div class="card-body">
          <h2 class="card-title">${esc(l.title || "Untitled")}</h2>
          <div class="card-loc">${esc(place || l.city || "Bangkok")}</div>
          <div class="card-price${unset ? " unset" : ""}">${esc(priceText(l))}</div>
          <div class="card-meta">${esc(metaParts(l).join(" · "))}</div>
          ${notes ? `<div class="card-notes">${esc(notes)}</div>` : ""}
        </div>
      </article>`;
    }).join("");
  }

  function buildingIcon(count, selected) {
    const size = selected ? 30 : 26;
    return L.divIcon({
      className: "pin-marker",
      html: `<div class="pin-dot pin-count${selected ? " selected" : ""}">${count}</div>`,
      iconSize: [size, size],
      iconAnchor: [size / 2, size / 2],
    });
  }

  // Directory pins with no listing are drawn on the canvas. A zoomed-in slice of
  // this directory can contain a few hundred buildings, and a DOM node per pin
  // makes that view stutter.
  function emptyPinStyle(selected) {
    return {
      radius: selected ? 8 : 5,
      color: selected ? "#16a34a" : "#94a3b8",
      weight: 2,
      fillColor: "#ffffff",
      fillOpacity: 1,
      opacity: 1,
    };
  }

  function inView(lat, lng) {
    if (!Number.isFinite(Number(lat)) || !Number.isFinite(Number(lng))) return false;
    return map.getBounds().contains([Number(lat), Number(lng)]);
  }

  function pinsToShow() {
    const q = focusedBuildingId ? "" : textQuery();
    const pins = new Map();
    allListings.forEach((l) => {
      if (!matchesStructural(l) || !listingMatchesText(l, q)) return;
      if (l.building_id && buildingById.has(l.building_id)) {
        const b = buildingById.get(l.building_id);
        if (!inMoveBounds(b.lat, b.lng)) return;
        const pin = pins.get(b.id) || { building: b, count: 0 };
        pin.count += 1;
        pins.set(b.id, pin);
        return;
      }
      // Listings that are not tied to a directory building still get their own pin.
      if (!inMoveBounds(l.lat, l.lng)) return;
      if (!Number.isFinite(Number(l.lat)) || !Number.isFinite(Number(l.lng))) return;
      pins.set("listing:" + l.id, {
        listing: l,
        count: 1,
        lat: Number(l.lat),
        lng: Number(l.lng),
      });
    });
    const showEmpty = map.getZoom() >= EMPTY_ZOOM && !q;
    const emptyCandidates = showEmpty
      ? allBuildings.filter((b) => !pins.has(b.id) && inView(b.lat, b.lng))
      : suggestions().map((hit) => hit.building).filter((b) => !pins.has(b.id));
    emptyCandidates.forEach((b) => {
      if (!pins.has(b.id)) pins.set(b.id, { building: b, count: 0 });
    });
    if (focusedBuildingId && !pins.has(focusedBuildingId)) {
      const b = buildingById.get(focusedBuildingId);
      if (b) pins.set(b.id, { building: b, count: unitsFor(b.id).length });
    }
    return pins;
  }

  function syncMarkers() {
    const pins = pinsToShow();
    const selectedBuilding = selectedId
      ? (allListings.find((l) => l.id === selectedId) || {}).building_id
      : null;
    markerLayer.clearLayers();
    markersById.clear();
    pins.forEach((pin, id) => {
      const lat = pin.building ? pin.building.lat : pin.lat;
      const lng = pin.building ? pin.building.lng : pin.lng;
      if (!Number.isFinite(Number(lat)) || !Number.isFinite(Number(lng))) return;
      const selected = id === focusedBuildingId || id === selectedBuilding || id === "listing:" + selectedId;
      const title = pin.building ? pin.building.name : (pin.listing.title || "");
      const marker = pin.count > 0
        ? L.marker([Number(lat), Number(lng)], {
            icon: buildingIcon(pin.count, selected),
            title,
            zIndexOffset: selected ? 500 : 200,
          })
        : L.circleMarker([Number(lat), Number(lng)], emptyPinStyle(selected));
      marker.on("click", () => {
        if (pin.building) focusBuilding(pin.building.id, { fromMap: true });
        else selectListing(pin.listing.id, { fromMap: true });
      });
      marker.addTo(markerLayer);
      markersById.set(id, { marker, count: pin.count });
    });
  }

  function paintMarkerSelection() {
    const selectedBuilding = selectedId
      ? (allListings.find((l) => l.id === selectedId) || {}).building_id
      : null;
    markersById.forEach((entry, id) => {
      const selected = id === focusedBuildingId || id === selectedBuilding || id === "listing:" + selectedId;
      if (entry.count > 0) {
        entry.marker.setIcon(buildingIcon(entry.count, selected));
        entry.marker.setZIndexOffset(selected ? 500 : 200);
      } else {
        entry.marker.setStyle(emptyPinStyle(selected));
        if (selected && entry.marker.bringToFront) entry.marker.bringToFront();
      }
    });
  }

  let overlayListing = null;
  let overlayPhotoIndex = 0;

  function renderOverlayPhoto() {
    if (!overlayListing) return;
    const n = photoCount(overlayListing);
    const src = photoSrc(overlayListing, overlayPhotoIndex);
    const nav = n > 1
      ? `<button type="button" class="ov-nav prev" data-dir="-1" aria-label="Previous photo">‹</button><button type="button" class="ov-nav next" data-dir="1" aria-label="Next photo">›</button><span class="photo-count">${overlayPhotoIndex + 1} / ${n}</span>`
      : "";
    el.ovPhoto.innerHTML = (src
      ? `<img src="${esc(src)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'placeholder',textContent:'No photo'}))">`
      : PLACEHOLDER) + nav;
  }

  function openOverlay(l) {
    overlayListing = l;
    overlayPhotoIndex = 0;
    renderOverlayPhoto();
    el.ovPrice.textContent = priceText(l);
    el.ovTitle.textContent = l.title || "Untitled";
    const b = buildingOf(l);
    el.ovLoc.textContent = [b && b.name, l.neighborhood, l.district].filter(Boolean).join(" · ") || (l.city || "Bangkok");
    el.ovMeta.textContent = metaParts(l).join(" · ");
    el.overlay.classList.add("open");
  }

  function closeOverlay() {
    el.overlay.classList.remove("open");
    overlayListing = null;
    overlayPhotoIndex = 0;
  }

  let detailListing = null;
  let galleryIndex = 0;
  let galleryPointerX = 0;
  let galleryDragged = false;
  let gallerySettle = 0;

  function factRow(label, text, opts = {}) {
    if (text == null || text === "") return "";
    const body = opts.html || esc(text);
    return `<div class="fact${opts.muted ? " fact-muted" : ""}"><dt>${esc(label)}</dt><dd>${body}</dd></div>`;
  }

  function detailFacts(l) {
    const b = buildingOf(l);
    const rows = [];
    if (b && b.name) {
      const thai = b.name_th && b.name_th !== b.name ? ` (${b.name_th})` : "";
      rows.push(factRow("Building", b.name + thai));
    }
    rows.push(factRow("Neighborhood", l.neighborhood));
    rows.push(factRow("District", l.district));
    rows.push(factRow("City", l.city));
    if (l.province && l.province !== l.city) rows.push(factRow("Province", l.province));
    if (l.bedrooms != null) rows.push(factRow("Bedrooms", String(l.bedrooms)));
    if (l.bathrooms != null) rows.push(factRow("Bathrooms", String(l.bathrooms)));
    if (l.size_sqm != null) rows.push(factRow("Size", `${l.size_sqm} sqm`));
    rows.push(factRow("Type", typeLabel(l.property_type)));
    if (l.status) rows.push(factRow("Status", STATUS_LABEL[l.status] || l.status));
    if (l.available_from) rows.push(factRow("Available from", formatWhen(l.available_from)));
    if (l.listed_at) rows.push(factRow("Listed", formatWhen(l.listed_at)));
    if (l.scraped_at) rows.push(factRow("Recorded", formatWhen(l.scraped_at)));
    if (l.contact) rows.push(factRow("Contact", l.contact));
    else rows.push(factRow("Contact", "Contact not listed", { muted: true }));
    const sourceUrl = httpUrl(l.source_url);
    if (l.source || sourceUrl) {
      const name = l.source || "Listing source";
      const link = sourceUrl
        ? ` <a href="${esc(sourceUrl)}" target="_blank" rel="noopener noreferrer">View source</a>`
        : "";
      rows.push(factRow("Source", name, { html: `${esc(name)}${link}` }));
    }
    return rows.join("");
  }

  function galleryChrome() {
    const counter = el.detail.querySelector(".photo-count");
    const photos = detailListing ? photoList(detailListing) : [];
    if (counter) counter.textContent = photos.length ? `${galleryIndex + 1} / ${photos.length}` : "";
    el.detail.querySelectorAll(".thumb").forEach((thumb) => {
      const on = Number(thumb.dataset.index) === galleryIndex;
      thumb.setAttribute("aria-current", on ? "true" : "false");
    });
  }

  function scrollBehavior(preferred) {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return "auto";
    return preferred || "smooth";
  }

  function scrollGalleryTo(index, behavior) {
    const track = el.detail.querySelector(".gallery-track");
    const photos = detailListing ? photoList(detailListing) : [];
    if (!photos.length) return;
    galleryIndex = (index + photos.length) % photos.length;
    const motion = scrollBehavior(behavior);
    gallerySettle = Date.now() + (motion === "auto" ? 60 : 420);
    if (track && track.clientWidth) {
      track.scrollTo({ left: galleryIndex * track.clientWidth, behavior: motion });
    }
    galleryChrome();
    if (!el.lightbox.hidden) renderLightbox();
  }

  function onGalleryScroll() {
    const track = el.detail.querySelector(".gallery-track");
    if (!track || !track.clientWidth) return;
    const raw = track.scrollLeft / track.clientWidth;
    const i = Math.round(raw);
    if (Math.abs(raw - i) > 0.2) return;
    if (i < 0) return;
    if (Date.now() < gallerySettle && i !== galleryIndex) return;
    if (i === galleryIndex) return;
    galleryIndex = i;
    galleryChrome();
  }

  function renderDetail() {
    const l = detailListing;
    if (!l) return;
    const photos = photoList(l);
    const b = buildingOf(l);
    const place = [b && b.name, l.neighborhood, l.district, l.city].filter(Boolean).join(" · ");
    const backLabel = focusedBuildingId ? "Back to units" : "Back to listings";
    const specs = metaParts(l).join(" · ");
    const statusClass = l.status ? ` status-${l.status}` : "";
    const statusText = l.status ? (STATUS_LABEL[l.status] || l.status) : "";
    const slides = photos.length
      ? photos.map((src, i) => `<div class="gallery-slide"><img src="${esc(src)}" alt="Photo ${i + 1} of ${photos.length}" draggable="false" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'placeholder',textContent:'No photo'}))"></div>`).join("")
      : `<div class="gallery-slide">${PLACEHOLDER}</div>`;
    const nav = photos.length > 1
      ? `<button type="button" class="gal-nav prev" data-dir="-1" aria-label="Previous photo">‹</button><button type="button" class="gal-nav next" data-dir="1" aria-label="Next photo">›</button><span class="photo-count" aria-live="polite">1 / ${photos.length}</span>`
      : "";
    const thumbs = photos.length
      ? `<div class="thumbs">${photos.map((src, i) => `<button type="button" class="thumb" data-index="${i}" aria-label="Photo ${i + 1} of ${photos.length}" aria-current="${i === 0 ? "true" : "false"}"><img src="${esc(src)}" alt="" draggable="false"></button>`).join("")}</div><p class="gallery-hint">Swipe or use the arrows. Click a photo to enlarge.</p>`
      : "";
    const notes = (l.raw_notes || "").trim();
    el.detail.innerHTML = `<div class="detail-bar">
        <button type="button" class="btn detail-back">‹ ${esc(backLabel)}</button>
        <button type="button" class="btn detail-map">Show on map</button>
      </div>
      <div class="detail-inner">
        <article class="detail-card">
          <div class="gallery-frame">
            <div class="gallery-track" tabindex="0" aria-label="Listing photos">${slides}</div>
            ${nav}
          </div>
          ${thumbs}
          <div class="detail-copy">
            <h2 class="detail-title" id="detailTitle">${esc(l.title || "Untitled")}</h2>
            ${place ? `<div class="detail-loc">${esc(place)}</div>` : ""}
            <div class="detail-price-row">
              <div class="detail-price${l.price_thb == null ? " unset" : ""}">${esc(detailPrice(l))}</div>
              ${statusText ? `<span class="status-pill${statusClass}">${esc(statusText)}</span>` : ""}
            </div>
            ${specs ? `<div class="detail-specs">${esc(specs)}</div>` : ""}
            <div class="facts">${detailFacts(l)}</div>
            ${notes ? `<div class="detail-notes"><h3>Notes</h3>${esc(notes)}</div>` : ""}
          </div>
        </article>
      </div>`;
    const track = el.detail.querySelector(".gallery-track");
    if (track) track.addEventListener("scroll", onGalleryScroll, { passive: true });
  }

  function openDetail(l) {
    if (!l) return;
    const same = detailListing && detailListing.id === l.id && !el.detail.hidden;
    detailListing = l;
    if (!same) {
      galleryIndex = 0;
      renderDetail();
      el.detail.scrollTop = 0;
    }
    el.detail.hidden = false;
    if (window.matchMedia("(max-width: 820px)").matches) setMobileView("list");
    if (!same) {
      const back = el.detail.querySelector(".detail-back");
      if (back) back.focus();
    }
  }

  function detailIsVisible() {
    if (el.detail.hidden) return false;
    if (window.matchMedia("(max-width: 820px)").matches && document.body.classList.contains("view-map")) return false;
    return true;
  }

  function closeDetail(opts = {}) {
    const wasOpen = !el.detail.hidden;
    if (!el.lightbox.hidden) closeLightbox();
    el.detail.hidden = true;
    el.detail.innerHTML = "";
    detailListing = null;
    galleryIndex = 0;
    if (opts.focusCard && wasOpen && selectedId) {
      const card = el.list.querySelector(`.card[data-id="${CSS.escape(selectedId)}"]`);
      if (card) card.focus();
    }
  }

  function renderLightbox() {
    const photos = detailListing ? photoList(detailListing) : [];
    if (!photos.length) return;
    if (galleryIndex >= photos.length) galleryIndex = 0;
    const src = photos[galleryIndex];
    el.lbImg.src = src;
    el.lbImg.alt = `Photo ${galleryIndex + 1} of ${photos.length}`;
    el.lbCounter.textContent = `${galleryIndex + 1} / ${photos.length}`;
    const multi = photos.length > 1;
    el.lbPrev.hidden = !multi;
    el.lbNext.hidden = !multi;
  }

  function openLightbox(index) {
    const photos = detailListing ? photoList(detailListing) : [];
    if (!photos.length) return;
    const opening = el.lightbox.hidden;
    galleryIndex = (index + photos.length) % photos.length;
    gallerySettle = Date.now() + 60;
    const track = el.detail.querySelector(".gallery-track");
    if (track && track.clientWidth) {
      track.scrollTo({ left: galleryIndex * track.clientWidth, behavior: "auto" });
    }
    galleryChrome();
    renderLightbox();
    el.lightbox.hidden = false;
    if (opening) el.lbClose.focus();
  }

  function closeLightbox() {
    el.lightbox.hidden = true;
    el.lbImg.removeAttribute("src");
    const track = el.detail.querySelector(".gallery-track");
    if (track) track.focus();
  }

  function stepLightbox(dir) {
    const photos = detailListing ? photoList(detailListing) : [];
    if (photos.length < 2) return;
    openLightbox(galleryIndex + dir);
  }

  function hideSuggest() {
    el.suggest.hidden = true;
    el.suggest.innerHTML = "";
    el.q.setAttribute("aria-expanded", "false");
    suggestIndex = -1;
  }

  function renderSuggest() {
    const hits = suggestions();
    if (!hits.length || document.activeElement !== el.q) {
      hideSuggest();
      return;
    }
    if (suggestIndex >= hits.length) suggestIndex = hits.length - 1;
    el.suggest.hidden = false;
    el.q.setAttribute("aria-expanded", "true");
    el.suggest.innerHTML = hits.map((hit, i) => {
      const b = hit.building;
      const sub = [areaText(b), b.name_th && b.name_th !== b.name ? b.name_th : "", b.type === "condo" ? "Condo" : b.type === "apartment" ? "Apartment" : "Building"]
        .filter(Boolean).join(" · ");
      const units = hit.units
        ? `${hit.units} unit${hit.units === 1 ? "" : "s"}`
        : "No units yet";
      return `<li role="option" id="sug-${i}" data-id="${esc(b.id)}" class="${i === suggestIndex ? "active" : ""}" aria-selected="${i === suggestIndex}">
        <div class="s-top"><span class="s-name">${esc(b.name)}</span><span class="s-units${hit.units ? "" : " none"}">${esc(units)}</span></div>
        <div class="s-sub">${esc(sub)}</div>
      </li>`;
    }).join("");
  }

  function selectListing(id, opts = {}) {
    const l = allListings.find((x) => x.id === id);
    if (!l) return;
    selectedId = id;
    el.list.querySelectorAll(".card").forEach((c) => {
      c.classList.toggle("selected", c.dataset.id === id);
    });
    const card = el.list.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
    if (card && opts.fromMap) card.scrollIntoView({ behavior: "smooth", block: "nearest" });
    paintMarkerSelection();
    if (!opts.skipPan && Number.isFinite(Number(l.lat)) && Number.isFinite(Number(l.lng))) {
      suppressMoveFilter = true;
      const z = Math.max(map.getZoom(), 16);
      map.setView([Number(l.lat), Number(l.lng)], z, { animate: true });
      setTimeout(() => { suppressMoveFilter = false; }, 400);
    }
    openOverlay(l);
    openDetail(l);
  }

  function focusBuilding(id, opts = {}) {
    const b = buildingById.get(id);
    if (!b) return;
    focusedBuildingId = id;
    suppressSearch = true;
    el.q.value = b.name || "";
    suppressSearch = false;
    hideSuggest();
    selectedId = null;
    closeOverlay();
    closeDetail();
    refresh();
    suppressMoveFilter = true;
    map.setView([Number(b.lat), Number(b.lng)], Math.max(map.getZoom(), 17), { animate: true });
    setTimeout(() => { suppressMoveFilter = false; syncMarkers(); }, 400);
    const units = filtered();
    if (units.length === 1) selectListing(units[0].id, { fromMap: !!opts.fromMap, skipPan: true });
    if (!opts.fromMap && window.matchMedia("(max-width: 820px)").matches) setMobileView("list");
  }

  function showAll() {
    focusedBuildingId = null;
    selectedId = null;
    suppressSearch = true;
    el.q.value = "";
    suppressSearch = false;
    hideSuggest();
    closeOverlay();
    closeDetail();
    refresh({ fit: true });
  }

  function refresh({ fit } = {}) {
    const items = filtered();
    renderList(items);
    syncMarkers();
    if (selectedId && !items.some((x) => x.id === selectedId)) {
      selectedId = null;
      closeOverlay();
      closeDetail();
      paintMarkerSelection();
    }
    if (fit) {
      suppressMoveFilter = true;
      if (areaBbox) {
        map.fitBounds(
          [[areaBbox.south, areaBbox.west], [areaBbox.north, areaBbox.east]],
          { padding: [20, 20] }
        );
      } else {
        const pts = items
          .filter((l) => Number.isFinite(Number(l.lat)) && Number.isFinite(Number(l.lng)))
          .map((l) => [Number(l.lat), Number(l.lng)]);
        if (pts.length === 1) map.setView(pts[0], 16);
        else if (pts.length > 1) map.fitBounds(pts, { padding: [40, 40] });
        else map.setView(BANGKOK, 12);
      }
      setTimeout(() => { suppressMoveFilter = false; syncMarkers(); }, 400);
    }
  }

  function setMobileView(view) {
    document.body.classList.toggle("view-map", view === "map");
    el.btnList.classList.toggle("active", view === "list");
    el.btnMap.classList.toggle("active", view === "map");
    if (view === "map") setTimeout(() => map.invalidateSize(), 50);
  }

  el.list.addEventListener("click", (e) => {
    if (e.target.closest("#backAll")) {
      showAll();
      return;
    }
    const card = e.target.closest(".card");
    if (card) selectListing(card.dataset.id, { fromList: true });
  });
  el.list.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      const card = e.target.closest(".card");
      if (card) { e.preventDefault(); selectListing(card.dataset.id, { fromList: true }); }
    }
  });
  el.ovPhoto.addEventListener("click", (e) => {
    const btn = e.target.closest(".ov-nav");
    if (!btn || !overlayListing) return;
    const n = photoCount(overlayListing);
    if (n < 2) return;
    const dir = Number(btn.dataset.dir);
    overlayPhotoIndex = (overlayPhotoIndex + dir + n) % n;
    renderOverlayPhoto();
  });
  el.ovClose.addEventListener("click", () => {
    closeOverlay();
    if (detailIsVisible()) return;
    closeDetail();
    selectedId = null;
    paintMarkerSelection();
    el.list.querySelectorAll(".card.selected").forEach((c) => c.classList.remove("selected"));
  });
  el.ovDetails.addEventListener("click", (e) => {
    e.stopPropagation();
    if (overlayListing) openDetail(overlayListing);
  });
  el.overlay.addEventListener("click", (e) => {
    if (e.target.closest(".ov-close, .ov-nav, .ov-details")) return;
    if (overlayListing) openDetail(overlayListing);
  });

  el.detail.addEventListener("keydown", (e) => {
    if ((e.key === "Enter" || e.key === " ") && e.target.closest(".gallery-track")) {
      e.preventDefault();
      openLightbox(galleryIndex);
    }
  });
  el.detail.addEventListener("click", (e) => {
    if (e.target.closest(".detail-back")) {
      closeDetail({ focusCard: true });
      return;
    }
    if (e.target.closest(".detail-map")) {
      setMobileView("map");
      return;
    }
    const nav = e.target.closest(".gal-nav");
    if (nav) {
      const photos = detailListing ? photoList(detailListing) : [];
      if (photos.length < 2) return;
      const dir = Number(nav.dataset.dir);
      scrollGalleryTo(galleryIndex + dir, "smooth");
      return;
    }
    const thumb = e.target.closest(".thumb");
    if (thumb) {
      openLightbox(Number(thumb.dataset.index));
      return;
    }
    if (e.target.closest(".gallery-slide") && !galleryDragged) openLightbox(galleryIndex);
  });
  el.detail.addEventListener("pointerdown", (e) => {
    if (!e.target.closest(".gallery-track")) return;
    gallerySettle = 0;
    galleryPointerX = e.clientX;
    galleryDragged = false;
  });
  el.detail.addEventListener("pointermove", (e) => {
    if (Math.abs(e.clientX - galleryPointerX) > 10) galleryDragged = true;
  });

  el.lbClose.addEventListener("click", closeLightbox);
  el.lbPrev.addEventListener("click", () => stepLightbox(-1));
  el.lbNext.addEventListener("click", () => stepLightbox(1));
  el.lightbox.addEventListener("click", (e) => {
    if (e.target === el.lightbox) closeLightbox();
  });
  let lbStartX = null;
  let lbStartY = null;
  el.lightbox.addEventListener("pointerdown", (e) => {
    if (e.target.closest("button")) { lbStartX = null; return; }
    lbStartX = e.clientX;
    lbStartY = e.clientY;
  });
  el.lightbox.addEventListener("pointerup", (e) => {
    if (lbStartX == null) return;
    const dx = e.clientX - lbStartX;
    const dy = e.clientY - lbStartY;
    lbStartX = null;
    if (Math.abs(dx) < 48 || Math.abs(dx) < Math.abs(dy)) return;
    stepLightbox(dx < 0 ? 1 : -1);
  });
  el.lightbox.addEventListener("keydown", (e) => {
    if (e.key !== "Tab") return;
    const nodes = [...el.lightbox.querySelectorAll("button")].filter((b) => !b.hidden);
    if (!nodes.length) return;
    const first = nodes[0];
    const last = nodes[nodes.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  });

  document.addEventListener("keydown", (e) => {
    if (!el.lightbox.hidden) {
      if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closeLightbox(); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); stepLightbox(-1); }
      else if (e.key === "ArrowRight") { e.preventDefault(); stepLightbox(1); }
      return;
    }
    const typing = e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
    if (!el.detail.hidden && !typing && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
      const photos = detailListing ? photoList(detailListing) : [];
      if (photos.length < 2) return;
      e.preventDefault();
      scrollGalleryTo(galleryIndex + (e.key === "ArrowLeft" ? -1 : 1), "smooth");
      return;
    }
    if (!el.detail.hidden && !typing && e.key === "Escape") closeDetail({ focusCard: true });
  }, true);

  window.addEventListener("resize", () => {
    if (el.detail.hidden) return;
    const track = el.detail.querySelector(".gallery-track");
    if (!track || !track.clientWidth) return;
    track.scrollTo({ left: galleryIndex * track.clientWidth, behavior: "auto" });
  });

  el.q.addEventListener("input", () => {
    if (suppressSearch) return;
    if (focusedBuildingId) {
      const b = buildingById.get(focusedBuildingId);
      if (!b || fold(el.q.value) !== fold(b.name)) {
        focusedBuildingId = null;
        selectedId = null;
        closeOverlay();
        closeDetail();
      }
    }
    suggestIndex = -1;
    renderSuggest();
    refresh();
  });
  el.q.addEventListener("focus", () => renderSuggest());
  el.q.addEventListener("blur", () => setTimeout(hideSuggest, 150));
  el.q.addEventListener("keydown", (e) => {
    const options = [...el.suggest.querySelectorAll("li")];
    if (e.key === "ArrowDown" && options.length) {
      e.preventDefault();
      suggestIndex = (suggestIndex + 1) % options.length;
      renderSuggest();
    } else if (e.key === "ArrowUp" && options.length) {
      e.preventDefault();
      suggestIndex = (suggestIndex - 1 + options.length) % options.length;
      renderSuggest();
    } else if (e.key === "Enter" && options.length) {
      e.preventDefault();
      const pick = options[suggestIndex] || options[0];
      if (pick) focusBuilding(pick.dataset.id);
    } else if (e.key === "Escape") {
      hideSuggest();
    }
  });
  el.suggest.addEventListener("mousedown", (e) => {
    const item = e.target.closest("li");
    if (!item) return;
    e.preventDefault();
    focusBuilding(item.dataset.id);
  });

  ["input", "change"].forEach((ev) => {
    [el.priceMin, el.priceMax, el.beds, el.ptype].forEach((node) => {
      node.addEventListener(ev, () => refresh());
    });
  });
  el.searchAsMove.addEventListener("change", () => refresh());
  el.reset.addEventListener("click", () => {
    el.priceMin.value = "";
    el.priceMax.value = "";
    el.beds.value = "";
    el.ptype.value = "";
    el.searchAsMove.checked = false;
    showAll();
  });

  map.on("moveend", () => {
    if (suppressMoveFilter) return;
    if (el.searchAsMove.checked) refresh();
    else if (map.getZoom() >= EMPTY_ZOOM) syncMarkers();
  });
  map.on("zoomend", () => {
    if (suppressMoveFilter) return;
    syncMarkers();
  });

  el.btnList.addEventListener("click", () => setMobileView("list"));
  el.btnMap.addEventListener("click", () => setMobileView("map"));

  function fitAreaSoon() {
    refresh({ fit: true });
    setTimeout(() => map.invalidateSize(), 100);
  }

  const boot = (listings, directory) => {
    allListings = Array.isArray(listings) ? listings : [];
    const buildings = directory && Array.isArray(directory.buildings) ? directory.buildings : [];
    allBuildings = buildings;
    buildingById.clear();
    foldedNames.clear();
    buildings.forEach((b) => {
      buildingById.set(b.id, b);
      foldedFor(b);
    });
    const areas = directory && Array.isArray(directory.areas) ? directory.areas : [];
    areas.forEach((area) => {
      if (area && area.id && area.name) AREA_LABEL[area.id] = area.name;
    });
    const sukIds = areas.filter((area) => area && area.corridor === "sukhumvit").map((area) => area.id);
    if (sukIds.length) SUKHUMVIT_IDS = sukIds;
    AREA_LABEL.ekamai = "Ekamai";
    renderHeader(areas);
    areaBbox = directory && directory.area ? directory.area.bbox : null;
    fitAreaSoon();
  };

  const loadJson = (url) => fetch(url).then((r) => {
    if (!r.ok) throw new Error("HTTP " + r.status + " " + url);
    return r.json();
  });

  if (Array.isArray(window.__LISTINGS__)) {
    boot(window.__LISTINGS__, window.__BUILDINGS__ || null);
  } else {
    Promise.all([loadJson("data/listings.json"), loadJson("data/buildings.json")])
      .then(([listings, directory]) => boot(listings, directory))
      .catch((err) => {
        console.error(err);
        el.list.innerHTML = `<div class="empty-state">Listings could not be loaded.</div>`;
        el.count.textContent = "Error loading";
      });
  }
})();
  </script>
</body>
</html>
